<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="VocabStory — İngilizceyi hikâyeler, konuşma pratiği ve akıllı tekrarlarla öğren." />
  <title>VocabStory</title>
  <link rel="icon" href="./favicon.svg?v=4.1.1" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest?v=4.1.1" />
  <link rel="stylesheet" href="./css/tokens.css?v=4.1.1" />
  <link rel="stylesheet" href="./css/app.css?v=4.1.1" />
  <link rel="stylesheet" href="./css/reader.css?v=4.1.1" />
  <link rel="stylesheet" href="./css/responsive.css?v=4.1.1" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#/home" aria-label="VocabStory ana sayfa">
        <span class="brand-mark" aria-hidden="true">V</span>
        <span class="brand-copy">
          <strong>VocabStory</strong>
          <small>Read. Speak. Remember.</small>
        </span>
      </a>

      <nav class="desktop-nav" aria-label="Ana gezinme">
        <a href="#/home" data-route-link="home">Home</a>
        <a href="#/read" data-route-link="read">Read</a>
        <a href="#/speak" data-route-link="speak">Speak</a>
        <a href="#/vocabulary" data-route-link="vocabulary">Vocabulary</a>
        <a href="#/progress" data-route-link="progress">Progress</a>
      </nav>

      <div class="topbar-actions">
        <button class="icon-button" id="themeButton" type="button" aria-label="Tema değiştir" data-icon="moon"></button>
        <button class="icon-button" id="settingsButton" type="button" aria-label="Ayarlar" data-icon="settings"></button>
      </div>
    </header>

    <main id="app" class="app-main" tabindex="-1"></main>

    <nav class="mobile-tabbar" aria-label="Mobil gezinme">
      <a href="#/home" data-route-link="home"><span data-icon="home"></span><small>Home</small></a>
      <a href="#/read" data-route-link="read"><span data-icon="book-open"></span><small>Read</small></a>
      <a href="#/speak" data-route-link="speak"><span data-icon="mic"></span><small>Speak</small></a>
      <a href="#/vocabulary" data-route-link="vocabulary"><span data-icon="library"></span><small>Words</small></a>
      <a href="#/progress" data-route-link="progress"><span data-icon="chart"></span><small>Progress</small></a>
    </nav>
  </div>

  <div class="modal-backdrop" id="settingsModal" aria-hidden="true">
    <section class="modal settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-header">
        <div>
          <span class="eyebrow">VocabStory</span>
          <h2 id="settingsTitle">Ayarlar</h2>
        </div>
        <button class="icon-button" id="closeSettingsButton" type="button" aria-label="Ayarları kapat" data-icon="x"></button>
      </div>

      <div class="settings-tabs" role="tablist" aria-label="Ayar bölümleri">
        <button class="settings-tab active" type="button" data-settings-tab="general" role="tab">Genel</button>
        <button class="settings-tab" type="button" data-settings-tab="ai" role="tab">AI</button>
        <button class="settings-tab" type="button" data-settings-tab="data" role="tab">Veriler</button>
      </div>

      <div class="settings-panel active" data-settings-panel="general">
        <label class="field">
          <span>Varsayılan seviye</span>
          <select id="defaultLevelInput">
            <option>A1</option><option selected>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option>
          </select>
        </label>
        <label class="field">
          <span>Günlük ders hedefi</span>
          <input id="dailyGoalInput" type="number" min="1" max="20" step="1" />
        </label>
        <label class="field">
          <span>Okuma görünümü</span>
          <select id="readerModeInput">
            <option value="focus">Focus</option>
            <option value="learning">Learning panel</option>
          </select>
        </label>
      </div>

      <div class="settings-panel" data-settings-panel="ai">
        <div class="info-banner">
          <span data-icon="shield"></span>
          <p>GitHub Pages gibi statik sitelerde API anahtarı tarayıcıdan görülebilir. Üretim ortamında bir backend proxy kullanmak daha güvenlidir.</p>
        </div>
        <label class="field">
          <span>Gemini API anahtarı</span>
          <input id="apiKeyInput" type="password" autocomplete="off" placeholder="API key" />
        </label>
        <label class="field">
          <span>Tercih edilen model</span>
          <input id="modelInput" type="text" autocomplete="off" spellcheck="false" />
        </label>
        <label class="field">
          <span>Proxy endpoint <small>(opsiyonel)</small></span>
          <input id="proxyInput" type="url" placeholder="https://example.com/api/gemini" />
        </label>
      </div>

      <div class="settings-panel" data-settings-panel="data">
        <div class="settings-action-grid">
          <button class="secondary-button" type="button" id="exportDataButton"><span data-icon="download"></span> Yedeği indir</button>
          <label class="secondary-button file-button"><span data-icon="upload"></span> Yedek yükle<input type="file" id="importDataInput" accept="application/json,.json" /></label>
          <button class="secondary-button danger" type="button" id="resetDataButton"><span data-icon="trash"></span> Verileri sıfırla</button>
        </div>
      </div>

      <div class="modal-footer">
        <button class="primary-button" id="saveSettingsButton" type="button">Kaydet</button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="wordModal" aria-hidden="true">
    <section class="modal word-modal" role="dialog" aria-modal="true" aria-labelledby="wordModalTitle">
      <div class="modal-header">
        <div>
          <span class="eyebrow" id="wordModalMeta">Word</span>
          <h2 id="wordModalTitle">word</h2>
        </div>
        <button class="icon-button" id="closeWordModalButton" type="button" aria-label="Kelime penceresini kapat" data-icon="x"></button>
      </div>
      <div id="wordModalBody"></div>
    </section>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>

  <script>
    window.__VOCABSTORY_VERSION__ = '4.1.1';
    window.addEventListener('error', function (event) {
      if (event && event.filename) {
        console.error('[VocabStory boot error]', event.message, event.filename + ':' + event.lineno + ':' + event.colno);
      }
    }, true);
  </script>
  <script type="module" src="./js/app.js?v=4.1.1"></script>
</body>
</html>
